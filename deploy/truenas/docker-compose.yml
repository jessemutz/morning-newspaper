# Equivalent of the TrueNAS Custom App (Apps -> Discover -> Custom App, or Install via YAML).
# The image is built by .github/workflows/docker.yml on every push to main.
services:
  morning-paper:
    image: ghcr.io/jessemutz/morning-newspaper:latest
    restart: unless-stopped
    environment:
      TZ: America/Denver                     # cron runs on it
      PAPER_TOKEN: ${PAPER_TOKEN}            # also typed into the KOReader plugin
      LLAMA_API_KEY: ${LLAMA_API_KEY}        # same value llama-server on the Mac uses
      KAGI_API_KEY: ${KAGI_API_KEY}          # optional: web search
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY}  # optional: book lookups
    ports:
      - "8765:8765"
    volumes:
      - /mnt/tank/media/morning-paper/config:/config      # config.json
      - /mnt/tank/media/morning-paper/data:/data          # data_dir
      - /mnt/tank/media/eBooks:/library:ro          # CWA library (metadata.db + app.db), read-only
